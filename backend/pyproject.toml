[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "taskflow-backend"
version = "0.1.0"
description = "TaskFlow backend scaffold"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.13,<2.0",
  "argon2-cffi>=23.1,<26.0",
  "celery>=5.4,<6.0",
  "email-validator>=2.2,<3.0",
  "fastapi>=0.115,<1.0",
  "pyjwt>=2.9,<3.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic-settings>=2.4,<3.0",
  "psycopg[binary]>=3.2,<4.0",
  "redis>=5.0,<6.0",
  "sqlalchemy>=2.0,<3.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1.0",
  "mypy>=1.11,<2.0",
  "pytest>=9.0.3,<10.0",
  "pytest-cov>=5.0,<8.0",
  "ruff>=0.6,<1.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = true
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
# Celery ships no type stubs/py.typed marker, so its decorators are untyped
# (return Any) and mypy strict's disallow_untyped_decorators would otherwise
# flag every @celery_app.task / @signal.connect use in the worker layer.
module = ["celery.*", "app.workers.celery_app", "app.workers.tasks"]
ignore_missing_imports = true
disallow_untyped_decorators = false
